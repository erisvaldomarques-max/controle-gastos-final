<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Controle de Gastos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #1a1a2e;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card h3 {
            color: #666;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 10px;
        }
        .card .valor {
            font-size: 28px;
            font-weight: bold;
        }
        .card .valor.verde { color: #22c55e; }
        .card .valor.vermelho { color: #ef4444; }
        .card .valor.azul { color: #3b82f6; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .grafico-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .grafico-container h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .lista-transacoes {
            max-height: 400px;
            overflow-y: auto;
        }
        .transacao-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .transacao-item .descricao {
            font-weight: 500;
        }
        .transacao-item .categoria {
            font-size: 12px;
            color: #666;
            background: #f0f2f5;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .transacao-item .valor {
            font-weight: bold;
        }
        .transacao-item .valor.receita { color: #22c55e; }
        .transacao-item .valor.despesa { color: #ef4444; }
        
        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💰 Controle de Gastos Inteligente</h1>
        
        <div class="cards" id="cards">
            <div class="card">
                <h3>💳 Saldo Total</h3>
                <div class="valor azul" id="saldo">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>📈 Receitas</h3>
                <div class="valor verde" id="receitas">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>📉 Despesas</h3>
                <div class="valor vermelho" id="despesas">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>📝 Transações</h3>
                <div class="valor azul" id="totalTransacoes">0</div>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="grafico-container">
                <h2>📊 Gastos por Categoria</h2>
                <canvas id="graficoPizza"></canvas>
            </div>
            
            <div class="grafico-container">
                <h2>📋 Últimas Transações</h2>
                <div class="lista-transacoes" id="listaTransacoes">
                    <p style="color: #999;">Carregando...</p>
                </div>
            </div>
        </div>
        
        <div class="grafico-container" style="margin-top: 20px;">
            <h2>📈 Evolução do Saldo</h2>
            <canvas id="graficoLinha"></canvas>
        </div>
    </div>
    
    <script>
        // Busca os dados da API
        async function carregarDashboard() {
            try {
                const response = await fetch('/api/dashboard');
                const dados = await response.json();
                
                // Atualiza os cards
                document.getElementById('saldo').textContent = `R$ ${dados.saldo.toFixed(2)}`;
                document.getElementById('receitas').textContent = `R$ ${dados.total_receitas.toFixed(2)}`;
                document.getElementById('despesas').textContent = `R$ ${dados.total_despesas.toFixed(2)}`;
                document.getElementById('totalTransacoes').textContent = dados.total_transacoes;
                
                // Atualiza a lista de transações
                const lista = document.getElementById('listaTransacoes');
                lista.innerHTML = '';
                if (dados.transacoes.length === 0) {
                    lista.innerHTML = '<p style="color: #999;">Nenhuma transação este mês</p>';
                } else {
                    dados.transacoes.slice(0, 10).forEach(t => {
                        const div = document.createElement('div');
                        div.className = 'transacao-item';
                        div.innerHTML = `
                            <div>
                                <span class="descricao">${t.descricao}</span>
                                <span class="categoria">${t.categoria}</span>
                            </div>
                            <span class="valor ${t.tipo.toLowerCase()}">
                                ${t.tipo === 'RECEITA' ? '+' : '-'} R$ ${t.valor.toFixed(2)}
                            </span>
                        `;
                        lista.appendChild(div);
                    });
                }
                
                // Gráfico de Pizza (Categorias)
                const ctxPizza = document.getElementById('graficoPizza').getContext('2d');
                const cores = ['#22c55e', '#ef4444', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6'];
                new Chart(ctxPizza, {
                    type: 'pie',
                    data: {
                        labels: dados.categorias.map(c => c.nome),
                        datasets: [{
                            data: dados.categorias.map(c => c.valor),
                            backgroundColor: cores.slice(0, dados.categorias.length)
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });
                
                // Gráfico de Linha (Evolução)
                const ctxLinha = document.getElementById('graficoLinha').getContext('2d');
                // Agrupa por dia
                const dias = {};
                dados.transacoes.forEach(t => {
                    const data = t.data.split(' ')[0];
                    if (!dias[data]) dias[data] = 0;
                    dias[data] += t.tipo === 'RECEITA' ? t.valor : -t.valor;
                });
                const labels = Object.keys(dias).sort();
                const valores = labels.map(d => {
                    let saldo = 0;
                    for (let i = 0; i <= labels.indexOf(d); i++) {
                        saldo += dias[labels[i]];
                    }
                    return saldo;
                });
                
                new Chart(ctxLinha, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Saldo Acumulado',
                            data: valores,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { callback: v => 'R$ ' + v.toFixed(2) }
                            }
                        }
                    }
                });
                
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            }
        }
        
        carregarDashboard();
        // Atualiza a cada 30 segundos
        setInterval(carregarDashboard, 30000);
    </script>
</body>
</html>
